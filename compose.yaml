name: home-ai-server
services:
  # Expose the app on the LAN via https. If you don't need SSL, you can remove
  # this and connect to open-webui via http://localhost:3000.
  nginx:
    container_name: home-ai-server-nginx
    image: nginx:latest
    depends_on:
      - open-webui
    restart: unless-stopped
    ports:
      - "3443:443" # OpenWebUI
      - "3080:8080" # nginx status
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/cert.pem:/etc/nginx/cert.pem:ro
      - ./certs/key.pem:/etc/nginx/key.pem:ro

  # Standard open-webui (without embedded ollama). All it needs is a volume to
  # store the database.
  open-webui:
    container_name: home-ai-server-open-webui
    image: ghcr.io/open-webui/open-webui:main
    depends_on:
      - bedrock-gateway
      - litellm
    restart: unless-stopped
    ports:
      # Expose the app on localhost:3000 via plain HTTP for debugging. Change to
      # 0.0.0.0 to expose plain HTTP on the LAN.
      - "127.0.0.1:3000:8080"
    volumes:
      - ./open-webui:/app/backend/data
    environment:
      # Providing a stable key should preserve login sessions across container updates
      - WEBUI_SECRET_KEY="${WEBUI_SECRET_KEY}"

  # Bedrock Access Gateway serves Bedrock chat models
  bedrock-gateway:
    build:
      context: ./bedrock-access-gateway/src
      dockerfile: ./Dockerfile_ecs
    restart: unless-stopped
    ports:
      # Expose the API on localhost for testing and local use. Don't open to the
      # web or LAN without overriding the default access token.
      - "127.0.0.1:4000:80"
    environment:
      # AWS config is loaded from .env
      AWS_ACCESS_KEY_ID: "${OPENWEBUI_AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${OPENWEBUI_AWS_SECRET_ACCESS_KEY}"
      AWS_REGION: "${OPENWEBUI_AWS_REGION}"
      DEBUG: false

  # LiteLLM serves the Bedrock embedding model and providers that don't
  # serve openai-compatible completion APIs, e.g. Anthropic.
  litellm:
    container_name: home-ai-server-litellm
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    ports:
      # Expose the API on localhost:4100 for testing and local use.
      - "127.0.0.1:4100:4100"
    volumes:
      - ./litellm.yaml:/app/config.yaml:ro
    environment:
      AWS_ACCESS_KEY_ID: "${OPENWEBUI_AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${OPENWEBUI_AWS_SECRET_ACCESS_KEY}"
      AWS_REGION_NAME: "${OPENWEBUI_AWS_REGION}"

      ANTHROPIC_API_KEY: "${OPENWEBUI_ANTHROPIC_API_KEY}"

      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY}"
    command: ["--port", "4100", "--config", "/app/config.yaml"] #, "--detailed_debug"]

  # Auto-update public base images in this project
  watchtower:
    image: containrrr/watchtower
    depends_on:
      - open-webui
      - caddy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 900 home-ai-server-nginx home-ai-server-open-webui home-ai-server-litellm home-ai-server-caddy
    environment:
      DOCKER_API_VERSION: "1.52"

  # Tailscale web server node via Caddy sidecar with Tailscale extension
  caddy:
    container_name: home-ai-server-caddy
    build:
      context: .
      dockerfile_inline: |
        FROM caddy:2-builder-alpine AS builder
        RUN xcaddy build \
          --with github.com/tailscale/caddy-tailscale@main

        FROM caddy:2-alpine
        COPY --from=builder /usr/bin/caddy /usr/bin/caddy

        RUN apk --no-cache add mailcap
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./tailscale:/tailscale
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - TAILNET_ID=${CADDY_TAILNET_ID}
      - TS_AUTHKEY=${CADDY_TS_AUTHKEY}
      - TS_AUTH_ONCE=true
    restart: unless-stopped
    depends_on:
      - open-webui
    healthcheck:
      test:
        ["CMD", "wget", "--quiet", "--tries=1", "--spider", "https://localhost:443"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  open-webui:
  caddy_data:
  caddy_config:
